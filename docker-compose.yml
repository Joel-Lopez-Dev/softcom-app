version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: softcom-postgres
    environment:
      POSTGRES_USER: softcom
      POSTGRES_PASSWORD: softcom_dev_2026
      POSTGRES_DB: softcom_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./BD/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./BD/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - softcom-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U softcom -d softcom_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Opcional: pgAdmin para administración visual
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: softcom-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@softcom.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - softcom-network

volumes:
  postgres_data:
    driver: local

networks:
  softcom-network:
    driver: bridge
